# タブ × 都県ごとの収集件数上限。
# 0 は「limits.yaml の値としてスキップ」(--limit で上書きすれば動く)。
#
# 一都三県 (東京・神奈川・埼玉・千葉) 全域を 100 件ずつで有効化。
# 理論最大 = 5 タブ × 4 県 × 100 = 2000 行。
# 上限を下げたい場合は `--limit N` で個別に上書き、
# 完全に止めたいエリアは 0 に戻す。

